[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sir-magick"
version = "0.1.0"
description = "CPU-based image detection and effects for Sir Magick"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
sirmagick = ["assets/img/shades.png", "assets/img/blunt.png", "assets/img/cig.leftside.jpg", "assets/img/anime.rays.jpg", "assets/img/wasted.gta.jpg", "assets/img/youdied.souls.jpg", "assets/img/horni.jail.jpg", "assets/font/Dystopian-Canticle-Regular.otf", "assets/font/license_Dystopian-Canticle.txt", "assets/font/ArtDystopia.ttf", "assets/font/Metal Lord.otf"]

[project.scripts]
sirmagick = "sirmagick.cli:main"

[tool.setuptools.packages.find]
include = ["sirmagick*"]
